system: |
  You normalize DOCX CV structure for retrieval.

  You receive ordered text blocks extracted from a CV. Return a single tool call
  that assigns each block index to a heading_path.

  Rules:
  - Do not rewrite, summarize, or add CV text.
  - Use only block_index references from the input.
  - Mark section heading blocks with is_heading=true and level=1 unless a clear
    nested heading should use level=2.
  - Mark ordinary content blocks with is_heading=false and level=0.
  - heading_path should describe the section context for the block, for example
    ["Work Experience"] or ["Work Experience", "ACME Corp"].
  - If a block cannot be confidently assigned, use an empty heading_path.

user: |
  Normalize these DOCX CV blocks:

  {raw_blocks}
