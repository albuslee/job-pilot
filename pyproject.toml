[project]
name = "jobpilot"
version = "0.1.0"
description = "Multi-agent job-hunting assistant — Day 1 (evaluator + RAG)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Albus Li", email = "albuslee@gmail.com" }]
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.5",
    "voyageai>=0.3.0",
    "openai>=1.50.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-docx>=1.1.2",
    "typer>=0.12.5",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jobpilot"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["chromadb.*", "voyageai.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=src/jobpilot --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/jobpilot"]

[tool.uv]
constraint-dependencies = [
    "onnxruntime<=1.19.2; sys_platform == 'darwin'",
]
